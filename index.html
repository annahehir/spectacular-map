<html lang="en">

  <title>Spectacular Billboard Inventory Atlas</title>

    .sidebar-header p { font-size: 0.85rem; color: #94a3b8; }
    .controls { padding: 15px 20px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    .search-box { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .search-box:focus { border-color: #38bdf8; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 600; }
    .select-box { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.85rem; outline: none; cursor: pointer; }
    .stats-bar { padding: 10px 20px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 0.8rem; color: #38bdf8; font-weight: 600; display: flex; justify-content: space-between; }
    .inventory-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: #334155; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; cursor: pointer; transition: all 0.2s ease; }
    .card:hover { background: #475569; border-color: #38bdf8; transform: translateY(-1px); }
    .card-title { font-size: 0.95rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .card-badge { font-size: 0.7rem; padding: 2px 6px; background: #0284c7; color: #fff; border-radius: 4px; font-weight: 600; }
    .card-sub { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 2px; }
    .card-loc { font-size: 0.75rem; color: #94a3b8; }
    #map { flex: 1; height: 100%; background: #0f172a; }
    
    /* Popup styling */
    .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border-radius: 12px; border: 1px solid #475569; padding: 0; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .leaflet-popup-content { margin: 0; width: 290px !important; }
    .leaflet-container a.leaflet-popup-close-button { color: #cbd5e1; padding: 8px; z-index: 10; }
    .popup-img-container { width: 100%; height: 160px; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-bottom: 1px solid #334155; }
    .popup-img { width: 100%; height: 100%; object-fit: cover; }
    .popup-img-fallback { color: #64748b; font-size: 0.8rem; text-align: center; padding: 15px; font-style: italic; }
    .popup-body { padding: 14px; }
    .popup-title { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
    .popup-meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .popup-meta span { color: #e2e8f0; font-weight: 600; }
    .popup-actions { margin-top: 12px; display: flex; gap: 8px; }
    .btn { flex: 1; padding: 8px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-align: center; text-decoration: none; transition: background 0.2s; cursor: pointer; border: none; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #334155; color: #e2e8f0; border: 1px solid #475569; }
    .btn-secondary:hover { background: #475569; }
    
    @media (max-width: 768px) {
      #app { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 40%; }
      #map { height: 60%; }
    }
  </style>
</head>

<div id="app">

    <div class="stats-bar">

    <div class="inventory-list" id="inventoryList"></div>
  </div>
  <div id="map"></div>
</div>

  // Initialize Map using OpenStreetMap tiles (No API key required)
  const map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
  
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const markersGroup = L.markerClusterGroup({
    maxClusterRadius: 35,
    disableClusteringAtZoom: 15
  });
  map.addLayer(markersGroup);

  let markerMap = {};

  // Populate Dropdown Filters
  const cities = [...new Set(data.map(item => item.city).filter(Boolean))].sort();
  const pubs = [...new Set(data.map(item => item.pub).filter(Boolean))].sort();

  const citySelect = document.getElementById('cityFilter');
  cities.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    citySelect.appendChild(opt);
  });

  const pubSelect = document.getElementById('pubFilter');
  pubs.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    pubSelect.appendChild(opt);
  });

  function getTitle(item) {
    return item.adunit_name || item.asset_name || ('Billboard #' + item.id);
  }

  function renderMapAndList() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const selectedCity = citySelect.value;
    const selectedPub = pubSelect.value;

    markersGroup.clearLayers();
    markerMap = {};
    const listContainer = document.getElementById('inventoryList');
    listContainer.innerHTML = '';

    let visibleCount = 0;

    data.forEach(item => {
      const title = getTitle(item);
      const matchesSearch = !searchTerm || 
        title.toLowerCase().includes(searchTerm) || 
        item.city.toLowerCase().includes(searchTerm) || 
        item.pub.toLowerCase().includes(searchTerm) || 
        item.addr.toLowerCase().includes(searchTerm) ||
        item.id.includes(searchTerm);

      const matchesCity = !selectedCity || item.city === selectedCity;
      const matchesPub = !selectedPub || item.pub === selectedPub;

      if (matchesSearch && matchesCity && matchesPub) {
        visibleCount++;

        // Custom Marker
        const marker = L.marker([item.lat, item.lng]);

        // Build Popup HTML
        const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${item.lat},${item.lng}`;
        const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;

        let imgHtml = '';
        if (item.img && !item.img.includes('dropbox.com')) {
          imgHtml = `<img src="${item.img}" class="popup-img" alt="${title}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'popup-img-fallback\'>Photo link pending<br>Click Street View below</div>';"/>`;
        } else if (item.img && item.img.includes('dropbox.com')) {
          imgHtml = `<div class="popup-img-fallback">📁 Spec Sheet available on Dropbox<br><a href="${item.img}" target="_blank" style="color:#38bdf8;margin-top:4px;display:inline-block;">Open Dropbox Folder ↗</a></div>`;
        } else {
          imgHtml = `<div class="popup-img-fallback">📷 Photo pending upload<br>Use Street View camera below</div>`;
        }

        const popupContent = `
          <div class="popup-img-container">${imgHtml}</div>
          <div class="popup-body">
            <div class="popup-title">${title}</div>
            <div class="popup-meta">Publisher: <span>${item.pub}</span></div>
            <div class="popup-meta">Market: <span>${item.city}${item.state ? ', ' + item.state : ''}</span></div>
            <div class="popup-meta">Specs: <span>${item.dims}</span></div>
            <div class="popup-meta">Address: <span>${item.addr}</span></div>
            <div class="popup-actions">
              <a href="${streetViewUrl}" target="_blank" class="btn btn-primary">Street View ↗</a>
              <a href="${googleMapsUrl}" target="_blank" class="btn btn-secondary">Google Maps ↗</a>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersGroup.addLayer(marker);
        markerMap[item.id] = marker;

        // Build Sidebar Card
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">
            <span>${title}</span>
            <span class="card-badge">${item.pub}</span>
          </div>
          <div class="card-sub">${item.city}${item.state ? ', ' + item.state : ''}</div>
          <div class="card-loc">${item.addr}</div>
        `;

        card.addEventListener('click', () => {
          map.setView([item.lat, item.lng], 16);
          marker.openPopup();
        });

        listContainer.appendChild(card);
      }
    });

    document.getElementById('visibleCount').textContent = visibleCount;
  }

  document.getElementById('searchInput').addEventListener('input', renderMapAndList);
  citySelect.addEventListener('change', renderMapAndList);
  pubSelect.addEventListener('change', renderMapAndList);

  // Initial Render
  renderMapAndList();
</script>
