<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Marker Cluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #sidebar { width: 360px; background: #1e293b; display: flex; flex-direction: column; border-right: 1px solid #334155; z-index: 1000; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid #334155; }
    .sidebar-header h1 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-bottom: 2px; }
    .sidebar-header p { font-size: 0.8rem; color: #94a3b8; }
    .controls { padding: 14px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
    input[type="text"], select { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.85rem; }
    input[type="text"]:focus, select:focus { outline: none; border-color: #38bdf8; }
    .stats-bar { padding: 8px 20px; background: #0f172a; font-size: 0.78rem; color: #94a3b8; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
    #inventory-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .inventory-card { background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .inventory-card:hover { border-color: #38bdf8; transform: translateY(-1px); }
    .inventory-card h3 { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; margin-bottom: 2px; }
    .inventory-card p { font-size: 0.78rem; color: #94a3b8; line-height: 1.3; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 0.68rem; font-weight: 600; margin-top: 4px; background: #0284c7; color: #fff; }
    .badge-photo { background: #059669; }
    #map { flex: 1; height: 100%; }
    .popup-card { color: #0f172a; max-width: 280px; }
    .popup-card h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 4px; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .popup-card p { font-size: 0.8rem; color: #475569; margin-bottom: 3px; line-height: 1.3; }
    .popup-img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin: 6px 0; background: #e2e8f0; border: 1px solid #cbd5e1; display: block; }
    .btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn { flex: 1; text-align: center; padding: 6px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-decoration: none; color: #fff; background: #2563eb; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Spectacular Atlas</h1>
      <p>Interactive Billboard Inventory</p>
    </div>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Search market, publisher, or ID..." />
      <select id="city-filter">
        <option value="">All Markets / Cities</option>
      </select>
      <select id="publisher-filter">
        <option value="">All Publishers</option>
      </select>
    </div>
    <div class="stats-bar">
      <span>Visible Screens: <strong id="visible-count">0</strong></span>
      <span>Total: <strong id="total-count">0</strong></span>
    </div>
    <div id="inventory-list"></div>
  </div>

  <div id="map"></div>

      {"id": "1956994", "name": "SF-DG-500", "pub": "Orange Barrel Media", "city": "SAN FRANCISCO", "state": "CA", "addr": "Market St & 4th St, San Francisco, CA 94103", "dims": "1000x500", "lat": 37.7858, "lng": -122.4065},
      {"id": "1956995", "name": "WAS-DG-500", "pub": "Orange Barrel Media", "city": "WASHINGTON", "state": "DC", "addr": "Gallery Place - 7th St NW, Washington, DC 20001", "dims": "1200x600", "lat": 38.8988, "lng": -77.0219}

    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);
    let markerMap = new Map();

    initFilters();
    renderMapAndList(inventoryData);

    function initFilters() {
      const cities = [...new Set(inventoryData.map(item => item.city).filter(Boolean))].sort();
      const publishers = [...new Set(inventoryData.map(item => item.pub).filter(Boolean))].sort();

      const citySelect = document.getElementById('city-filter');
      citySelect.innerHTML = '<option value="">All Markets / Cities</option>';
      cities.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        citySelect.appendChild(opt);
      });

      const pubSelect = document.getElementById('publisher-filter');
      pubSelect.innerHTML = '<option value="">All Publishers</option>';
      publishers.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        pubSelect.appendChild(opt);
      });

      document.getElementById('search-input').addEventListener('input', applyFilters);
      citySelect.addEventListener('change', applyFilters);
      pubSelect.addEventListener('change', applyFilters);

      document.getElementById('total-count').textContent = inventoryData.length;
    }

    function renderMapAndList(data) {
      markersCluster.clearLayers();
      markerMap.clear();
      const listContainer = document.getElementById('inventory-list');
      listContainer.innerHTML = '';

      document.getElementById('visible-count').textContent = data.length;

      data.forEach(item => {
        const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${item.lat},${item.lng}`;
        const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;

        const marker = L.marker([item.lat, item.lng]);
        const popupContent = `
          <div class="popup-card">
            <h3>${item.name}</h3>
            <p><strong>Publisher:</strong> ${item.pub}</p>
            <p><strong>Market:</strong> ${item.city}${item.state ? ', ' + item.state : ''}</p>
            <p><strong>Address:</strong> ${item.addr}</p>
            <p><strong>Specs:</strong> ${item.dims}</p>
            <div class="btn-group">
              <a href="${streetViewUrl}" target="_blank" class="btn">Street View</a>
              <a href="${googleMapsUrl}" target="_blank" class="btn btn-secondary">Google Maps</a>
            </div>
          </div>
        `;
        marker.bindPopup(popupContent);
        markersCluster.addLayer(marker);
        markerMap.set(item.id, marker);

        const card = document.createElement('div');
        card.className = 'inventory-card';
        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.city}${item.state ? ', ' + item.state : ''} &bull; ${item.pub}</p>
          <span class="badge">${item.dims}</span>
        `;
        card.addEventListener('click', () => {
          map.setView([item.lat, item.lng], 16);
          marker.openPopup();
        });
        listContainer.appendChild(card);
      });
    }

    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const selectedCity = document.getElementById('city-filter').value;
      const selectedPub = document.getElementById('publisher-filter').value;

      const filtered = inventoryData.filter(item => {
        const matchesSearch = !search || 
          (item.name && item.name.toLowerCase().includes(search)) ||
          (item.city && item.city.toLowerCase().includes(search)) ||
          (item.pub && item.pub.toLowerCase().includes(search)) ||
          (item.addr && item.addr.toLowerCase().includes(search));
        
        const matchesCity = !selectedCity || item.city === selectedCity;
        const matchesPub = !selectedPub || item.pub === selectedPub;

        return matchesSearch && matchesCity && matchesPub;
      });

      renderMapAndList(filtered);
    }
  </script>
</body>
</html>
