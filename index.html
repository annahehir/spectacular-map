<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spectacular Billboard Inventory Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #sidebar { width: 360px; background: #1e293b; display: flex; flex-direction: column; border-right: 1px solid #334155; z-index: 1000; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; }
    .sidebar-header h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
    .sidebar-header p { font-size: 0.85rem; color: #94a3b8; }
    .controls { padding: 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    input[type="text"], select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.9rem; }
    input[type="text"]:focus, select:focus { outline: none; border-color: #38bdf8; }
    .stats-bar { padding: 12px 20px; background: #0f172a; font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
    #inventory-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .inventory-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .inventory-card:hover { border-color: #38bdf8; transform: translateY(-1px); }
    .inventory-card h3 { font-size: 0.95rem; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
    .inventory-card p { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; margin-top: 6px; background: #0284c7; color: #fff; }
    #map { flex: 1; height: 100%; }
    .popup-card { color: #0f172a; max-width: 280px; }
    .popup-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: #0f172a; }
    .popup-card p { font-size: 0.85rem; color: #475569; margin-bottom: 4px; }
    .popup-img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin: 8px 0; background: #e2e8f0; border: 1px solid #cbd5e1; display: block; }
    .btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn { flex: 1; text-align: center; padding: 6px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-decoration: none; color: #fff; background: #2563eb; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Spectacular Atlas</h1>
      <p>Interactive Billboard Inventory</p>
    </div>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Search by DMA, publisher, or ID..." />
      <select id="dma-filter">
        <option value="">All DMAs</option>
      </select>
      <select id="publisher-filter">
        <option value="">All Publishers</option>
      </select>
    </div>
    <div class="stats-bar">
      <span>Visible Screens: <strong id="visible-count">0</strong></span>
      <span>Total: <strong id="total-count">0</strong></span>
    </div>
    <div id="inventory-list"></div>
  </div>

  <div id="map"></div>

  <script>
    let inventoryData = [];

    // Initialize Map with Free CartoDB Tiles
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);
    let markerMap = new Map();

    // Dynamically load CSV directly from repository
    fetch('./place-exchange-locations-table-1789640040567.csv')
      .then(response => {
        if (!response.ok) throw new Error('CSV not found');
        return response.text();
      })
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            inventoryData = results.data.map((r, idx) => {
              let lat = parseFloat(r.latitude);
              let lng = parseFloat(r.longitude);
              if (isNaN(lat) || isNaN(lng)) return null;
              let img = (r.asset_image_url || '').trim();
              if (img.startsWith('http://')) img = img.replace('http://', 'https://');
              return {
                id: r.id || String(idx),
                name: r.adunit_name || r.asset_name || 'Spectacular Screen',
                pub: r.publisher || 'N/A',
                city: r.city || '',
                state: r.state || '',
                dma: r.dma || r.city || 'N/A',
                addr: r.address || 'N/A',
                dims: r.slot_dimensions || 'N/A',
                lat: lat,
                lng: lng,
                img: img
              };
            }).filter(Boolean);
            
            initFilters();
            renderMapAndList(inventoryData);
          }
        });
      })
      .catch(err => {
        console.error('CSV fetch failed:', err);
      });

    function initFilters() {
      const dmas = [...new Set(inventoryData.map(item => item.dma).filter(Boolean))].sort();
      const publishers = [...new Set(inventoryData.map(item => item.pub).filter(Boolean))].sort();

      const dmaSelect = document.getElementById('dma-filter');
      dmaSelect.innerHTML = '<option value="">All DMAs</option>';
      dmas.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        dmaSelect.appendChild(opt);
      });

      const pubSelect = document.getElementById('publisher-filter');
      pubSelect.innerHTML = '<option value="">All Publishers</option>';
      publishers.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        pubSelect.appendChild(opt);
      });

      document.getElementById('search-input').addEventListener('input', applyFilters);
      dmaSelect.addEventListener('change', applyFilters);
      pubSelect.addEventListener('change', applyFilters);

      document.getElementById('total-count').textContent = inventoryData.length;
    }

    function renderMapAndList(data) {
      markersCluster.clearLayers();
      markerMap.clear();
      const listContainer = document.getElementById('inventory-list');
      listContainer.innerHTML = '';

      document.getElementById('visible-count').textContent = data.length;

      data.forEach(item => {
        const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${item.lat},${item.lng}`;
        const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;

  let imageTag = '';
if (item.img) {
  if (item.img.includes('dropbox.com')) {
    // Converts Dropbox share links into raw image stream links
    const directImgUrl = item.img.replace('?dl=0', '?raw=1').replace('&dl=0', '&raw=1');
    imageTag = `
      <div style="margin:8px 0;">
        <img src="${directImgUrl}" class="popup-img" alt="Screen Preview" onerror="this.style.display='none';"/>
        <a href="${item.img}" target="_blank" style="display:block; margin-top:4px; font-size:0.8rem; color:#2563eb; font-weight:600; text-decoration:underline;">View Full Spec Sheet & Additional Photos (Dropbox)</a>
      </div>`;
  } else {
    imageTag = `<img src="${item.img}" class="popup-img" alt="Screen Preview" onerror="this.style.display='none';"/>`;
  }
}

        // Map Marker
        const marker = L.marker([item.lat, item.lng]);
        const popupContent = `
          <div class="popup-card">
            <h3>${item.name}</h3>
            <p><strong>Publisher:</strong> ${item.pub}</p>
            <p><strong>DMA:</strong> ${item.dma}</p>
            <p><strong>Address:</strong> ${item.addr}</p>
            <p><strong>Specs:</strong> ${item.dims}</p>
            ${imageTag}
            <div class="btn-group">
              <a href="${streetViewUrl}" target="_blank" class="btn">Street View</a>
              <a href="${googleMapsUrl}" target="_blank" class="btn btn-secondary">Google Maps</a>
            </div>
          </div>
        `;
        marker.bindPopup(popupContent);
        markersCluster.addLayer(marker);
        markerMap.set(item.id, marker);

        // Sidebar Card
        const card = document.createElement('div');
        card.className = 'inventory-card';
        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.dma} &bull; ${item.pub}</p>
          <span class="badge">${item.dims}</span>
        `;
        card.addEventListener('click', () => {
          map.setView([item.lat, item.lng], 16);
          marker.openPopup();
        });
        listContainer.appendChild(card);
      });
    }

    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const selectedDMA = document.getElementById('dma-filter').value;
      const selectedPub = document.getElementById('publisher-filter').value;

      const filtered = inventoryData.filter(item => {
        const matchesSearch = !search || 
          (item.name && item.name.toLowerCase().includes(search)) ||
          (item.dma && item.dma.toLowerCase().includes(search)) ||
          (item.city && item.city.toLowerCase().includes(search)) ||
          (item.pub && item.pub.toLowerCase().includes(search)) ||
          (item.addr && item.addr.toLowerCase().includes(search));
        
        const matchesDMA = !selectedDMA || item.dma === selectedDMA;
        const matchesPub = !selectedPub || item.pub === selectedPub;

        return matchesSearch && matchesDMA && matchesPub;
      });

      renderMapAndList(filtered);
    }
  </script>
</body>
</html>
