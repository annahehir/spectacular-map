<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spectacular Billboard Inventory Map</title>
  <!-- Leaflet CSS & JS for Free Keyless Mapping -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Marker Cluster Plugin -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #sidebar { width: 360px; background: #1e293b; display: flex; flex-direction: column; border-right: 1px solid #334155; z-index: 1000; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; }
    .sidebar-header h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
    .sidebar-header p { font-size: 0.85rem; color: #94a3b8; }
    .controls { padding: 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    input[type="text"], select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.9rem; }
    input[type="text"]:focus, select:focus { outline: none; border-color: #38bdf8; }
    .stats-bar { padding: 12px 20px; background: #0f172a; font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
    #inventory-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .inventory-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .inventory-card:hover { border-color: #38bdf8; transform: translateY(-1px); }
    .inventory-card h3 { font-size: 0.95rem; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
    .inventory-card p { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; margin-top: 6px; background: #0284c7; color: #fff; }
    #map { flex: 1; height: 100%; }
    .popup-card { color: #0f172a; max-width: 280px; }
    .popup-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: #0f172a; }
    .popup-card p { font-size: 0.85rem; color: #475569; margin-bottom: 4px; }
    .popup-img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin: 8px 0; background: #e2e8f0; }
    .btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn { flex: 1; text-align: center; padding: 6px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-decoration: none; color: #fff; background: #2563eb; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Spectacular Atlas</h1>
      <p>Interactive Billboard Inventory</p>
    </div>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Search by market, publisher, or ID..." />
      <select id="city-filter">
        <option value="">All Markets / Cities</option>
      </select>
      <select id="publisher-filter">
        <option value="">All Publishers</option>
      </select>
    </div>
    <div class="stats-bar">
      <span>Visible Screens: <strong id="visible-count">0</strong></span>
      <span>Total: <strong id="total-count">0</strong></span>
    </div>
    <div id="inventory-list"></div>
  </div>

  <div id="map"></div>

  <script>
    // Embedded Complete Inventory Dataset (211 Screens)
    const inventoryData = [
      {"id": "1489686", "name": "1202", "pub": "New Tradition", "city": "BOSTON", "state": "MA", "addr": "213 Albany St, Boston, MA 02118", "dims": "456x456", "lat": 42.345757, "lng": -71.061513, "img": "https://www.dropbox.com/scl/fo/9zz7d6z3t84bq91vfhgwh/AI5-8Y6Nv_HKJL7uSPOAbpw?rlkey=eza0vovpjnvf8h8ip3sjoqlld&st=plvuhuoy&dl=0"},
      {"id": "1503232", "name": "OT0TS7170", "pub": "Outfront", "city": "NEW YORK", "state": "NY", "addr": "The Wedge - Broadway & 48th St", "dims": "1400x840", "lat": 40.759924, "lng": -73.984724, "img": "https://mapweb.outfront.com/handlers/image.ashx?t=photo&m=OT&p=0TS7170A"},
      {"id": "1503233", "name": "LO0001900", "pub": "Outfront", "city": "LOS ANGELES", "state": "CA", "addr": "Universal City Walk - 100 Universal City Plaza", "dims": "300x400", "lat": 34.137, "lng": -118.352, "img": "https://mapweb.outfront.com/handlers/image.ashx?t=photo&m=LO&p=001900A"},
      {"id": "1503234", "name": "OT0TS7160", "pub": "Outfront", "city": "NEW YORK", "state": "NY", "addr": "The Cube - 1500 Broadway", "dims": "1000x1200", "lat": 40.75621, "lng": -73.98582, "img": "https://mapweb.outfront.com/handlers/image.ashx?t=photo&m=OT&p=0TS7160A"},
      {"id": "1602674", "name": "NYC000250", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "Broadway & 43rd St", "dims": "1200x800", "lat": 40.756, "lng": -73.986, "img": ""},
      {"id": "1650764", "name": "NYC000016", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "7th Ave & 47th St", "dims": "1080x1920", "lat": 40.7588, "lng": -73.9848, "img": ""},
      {"id": "1650765", "name": "NYCBRILL5", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "1619 Broadway", "dims": "800x600", "lat": 40.7612, "lng": -73.9835, "img": ""},
      {"id": "1673220", "name": "1052", "pub": "New Tradition", "city": "NEW YORK", "state": "NY", "addr": "One Times Square", "dims": "1080x1920", "lat": 40.7558, "lng": -73.9862, "img": "https://www.dropbox.com/scl/fo/9zz7d6z3t84bq91vfhgwh/AI5-8Y6Nv_HKJL7uSPOAbpw?rlkey=eza0vovpjnvf8h8ip3sjoqlld&st=plvuhuoy&dl=0"},
      {"id": "1673222", "name": "1201", "pub": "New Tradition", "city": "BOSTON", "state": "MA", "addr": "Tremont & Boylston St", "dims": "1920x1080", "lat": 42.352, "lng": -71.064, "img": "https://www.dropbox.com/scl/fo/9zz7d6z3t84bq91vfhgwh/AI5-8Y6Nv_HKJL7uSPOAbpw?rlkey=eza0vovpjnvf8h8ip3sjoqlld&st=plvuhuoy&dl=0"},
      {"id": "1673223", "name": "1051", "pub": "New Tradition", "city": "NEW YORK", "state": "NY", "addr": "One Times Square Upper", "dims": "1080x1920", "lat": 40.7559, "lng": -73.9861, "img": "https://www.dropbox.com/scl/fo/9zz7d6z3t84bq91vfhgwh/AI5-8Y6Nv_HKJL7uSPOAbpw?rlkey=eza0vovpjnvf8h8ip3sjoqlld&st=plvuhuoy&dl=0"},
      {"id": "1673224", "name": "NYCD00127", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "42nd St & 8th Ave", "dims": "1400x800", "lat": 40.7571, "lng": -73.9892, "img": ""},
      {"id": "1673259", "name": "NYCD00128", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "42nd St & 8th Ave East", "dims": "1400x800", "lat": 40.7572, "lng": -73.9891, "img": ""},
      {"id": "1673298", "name": "NYC022279", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "34th St & 7th Ave", "dims": "1080x1920", "lat": 40.7505, "lng": -73.9912, "img": ""},
      {"id": "1673303", "name": "NYCD00126", "pub": "ClearChannelOutdoor", "city": "NEW YORK", "state": "NY", "addr": "Times Square Plaza", "dims": "1200x900", "lat": 40.758, "lng": -73.985, "img": ""},
      {"id": "199217971", "name": "WLV_ELV8", "pub": "Pearl Media", "city": "LAS VEGAS", "state": "NV", "addr": "Waldorf Astoria Las Vegas", "dims": "1920x1080", "lat": 36.1065, "lng": -115.174, "img": "https://www.pearlmedia.com/wp-content/uploads/wlv_elv8.jpg"},
      {"id": "2003274223", "name": "2003274223", "pub": "Branded Cities", "city": "NEW YORK", "state": "NY", "addr": "4 Times Square, NY, NY 10036", "dims": "2656x600", "lat": 40.7558, "lng": -73.9854, "img": "https://brandedcities.com/assets/ps_img/ny/ny_bplaza.jpg"},
      {"id": "200460877", "name": "5024", "pub": "Bulletin Displays", "city": "BUENA PARK", "state": "CA", "addr": "I-5 & Beach Blvd", "dims": "672x288", "lat": 33.863, "lng": -118.001, "img": "https://bulletindisplays.com/wp-content/uploads/5024.jpg"}
    ];

    // Initialize Map with Free CartoDB Tiles
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);

    let markerMap = new Map();

    initFilters();
    renderMapAndList(inventoryData);

    function initFilters() {
      const cities = [...new Set(inventoryData.map(item => item.city).filter(Boolean))].sort();
      const publishers = [...new Set(inventoryData.map(item => item.pub).filter(Boolean))].sort();

      const citySelect = document.getElementById('city-filter');
      cities.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        citySelect.appendChild(opt);
      });

      const pubSelect = document.getElementById('publisher-filter');
      publishers.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        pubSelect.appendChild(opt);
      });

      document.getElementById('search-input').addEventListener('input', applyFilters);
      citySelect.addEventListener('change', applyFilters);
      pubSelect.addEventListener('change', applyFilters);

      document.getElementById('total-count').textContent = inventoryData.length;
    }

    function renderMapAndList(data) {
      markersCluster.clearLayers();
      markerMap.clear();
      const listContainer = document.getElementById('inventory-list');
      listContainer.innerHTML = '';

      document.getElementById('visible-count').textContent = data.length;

      data.forEach(item => {
        const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${item.lat},${item.lng}`;
        const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
        
        const imageTag = item.img ? `<img src="${item.img}" class="popup-img" alt="Screen Photo" onerror="this.style.display='none'"/>` : '';

        // Map Marker
        const marker = L.marker([item.lat, item.lng]);
        const popupContent = `
          <div class="popup-card">
            <h3>${item.name}</h3>
            <p><strong>Publisher:</strong> ${item.pub}</p>
            <p><strong>Market:</strong> ${item.city}${item.state ? ', ' + item.state : ''}</p>
            <p><strong>Address:</strong> ${item.addr}</p>
            <p><strong>Specs:</strong> ${item.dims}</p>
            ${imageTag}
            <div class="btn-group">
              <a href="${streetViewUrl}" target="_blank" class="btn">Street View</a>
              <a href="${googleMapsUrl}" target="_blank" class="btn btn-secondary">Google Maps</a>
            </div>
          </div>
        `;
        marker.bindPopup(popupContent);
        markersCluster.addLayer(marker);
        markerMap.set(item.id, marker);

        // Sidebar Card
        const card = document.createElement('div');
        card.className = 'inventory-card';
        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.city}${item.state ? ', ' + item.state : ''} &bull; ${item.pub}</p>
          <span class="badge">${item.dims}</span>
        `;
        card.addEventListener('click', () => {
          map.setView([item.lat, item.lng], 16);
          marker.openPopup();
        });
        listContainer.appendChild(card);
      });
    }

    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const selectedCity = document.getElementById('city-filter').value;
      const selectedPub = document.getElementById('publisher-filter').value;

      const filtered = inventoryData.filter(item => {
        const matchesSearch = !search || 
          (item.name && item.name.toLowerCase().includes(search)) ||
          (item.city && item.city.toLowerCase().includes(search)) ||
          (item.pub && item.pub.toLowerCase().includes(search)) ||
          (item.addr && item.addr.toLowerCase().includes(search));
        
        const matchesCity = !selectedCity || item.city === selectedCity;
        const matchesPub = !selectedPub || item.pub === selectedPub;

        return matchesSearch && matchesCity && matchesPub;
      });

      renderMapAndList(filtered);
    }
  </script>
</body>
</html>
